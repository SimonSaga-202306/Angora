<!doctype html>
<html lang="en">

<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap CSS -->
	<link href="<%=resource%>/custom/el.min.css" rel="stylesheet">
	<style type="text/css">
		html {
			height: 100%;
		}

		body {
			height: 100%;
			background-image: url('<%=resource%>/custom/login_bg.jpg');
			background-size: cover;
		}

		#app {
			height: 90%;
		}

		.container {
			width: 60%;
			background-color: white;
			text-align: center;
			margin-top: 30%;
			margin-left: 5%;
		}

		form {
			width: 80%;
			margin: auto;
		}

		img {
			width: 100%;
		}

		.error {
			color: red;
		}

		.input {
			margin-top: 10px;
		}

		.btn {
			margin-top: 40px;
			margin-bottom: 25px;
			width: 100%;
		}

		.rights {
			margin-bottom: 5px;
			text-align: center;
			color: white;
		}
	</style>
	<title>Login</title>
</head>

<body>
	<div id='app'>
		<el-row>
			<el-col :span='8' :offset='16'>
				<div class='container'>
					<el-form id='loginform' ref='form' :model='account' method="post"
						action="<%=pcdata(luci.http.getenv("REQUEST_URI"))%>">
						<div class="login_logo"> <img src='<%=resource%>/custom/login_logo.jpg'></div>
						<%- if fuser then %>
						<div class="error"><%:Invalid username and/or password! Please try again.%></div>
						<br />
						<% end -%>
						<el-input class='input' placeholder='<%:Please enter login account%>'
							prefix-icon="el-icon-user" v-model='account.name'>
						</el-input>
						<el-input class='input' placeholder='<%:Please enter the password%>' prefix-icon="el-icon-lock"
							type="password" v-model='account.passwd'>
						</el-input>
						<el-button class='btn' type="primary" @click="submit" round><%:Login Now%></el-button>
					</el-form>
				</div>
			</el-col>
		</el-row>
	</div>
	<!-- <div class='rights'>Copyright © 2021 中兴系统集成技术有限公司版权所有</div> -->
</body>
<script src="<%=resource%>/custom/vue.js"></script>
<script src="<%=resource%>/custom/el.min.js"></script>
<script src="<%=resource%>/custom/axios.min.js"></script>
<script>
	new Vue({
		el: '#app',
		data: function () {
			return {
				account: {
					name: '<%=duser%>',
					passwd: ''
				}
			}
		},
		methods: {
			submit() {
				var data = {
					username: this.account.name,
					password: this.account.passwd
				}
				var formData = new FormData();
				for (name in data) formData.append(name, data[name])
				// document.getElementById("loginform").submit();
				axios.post('<%=pcdata(luci.http.getenv("REQUEST_URI"))%>', formData).then(function (response) {
					document.open()
					document.write(response.data)
					document.close()
				})
			}
		}
	})
</script>

</html>
