name = "SWITCH_SMB_MAC3L_24GT4GS";

version = "0.1";

global = 
{
  @include "/etc/capcfg/sai/series/sw_smb_mac5.cfg"

  fan_spec = {
    support = true;
    subfan_num = 0;
    high_support = true;
    high_trig_level = 900;
    high_clear_level = 850;
  };  
  // poe cap, if no this filed, means don't support
  // poe_spec = 
  // {
  //  support = false;
  //  // for pd69104 or pd69208A
  //  pd_type = "pd69104";
  //  chip_num = 0;
  //  chip_powersupply = 0;
  //  sys_powersupply = 0;
  // }
  
  // port num (don't include inner port)
  port_num = 28;
  // inner port num, if no this filed, means none
  // inner_port_num = 0;
  // include subcard, if no this filed, means false
  // include_subcard = false;
};

device = {
  dev = (
    {
      // for lm75, tca1116, pd691xx, pca9548, gpio, cpld, i2c
      type = "gpio";
      // if no this filed, means id = 0
      // id = 0;
      // if no this filed, means name = type-id
      // name = "gpio-0";
      // if no this filed, means default = true;
      // default = true;
    },
    {
      type = "i2c";
    },
    {
      type = "sel";
    },
    {
      type = "pwm";
    },
    {
      type = "tca1116";
      id = 0;
      default = true;
    }
  );
  op_map = (
    {
      op = "tca1116_read";
      phy_ins = 0;     // tca1116-0
      addr = 0x74;
      dev_type = "i2c";
    },
    {
      op = "tca1116_write";
      phy_ins = 0;     // tca1116-0
      addr = 0x74;
      dev_type = "i2c";
    },
    {
      op = "optic_tx_en";
      phy_ins = 25;   //ifindex 9-12, for port 24-27
      phy_ins_num = 4;
      addr = 0x3;    //tca1116 reg
      offset = 0;    // offset 5-4  (port - 20)
      offset_step = 1;
      dev_type = "tca1116";
      dev_id = 0;
      op_type = "write";
    },
    {
      op = "optic_init";
      inherit_op = "optic_tx_en";
      addr_change = 4;            // means addr + 4 for every one
      // offset_change = xx;
    }
  );
};

port = (
  {
    ifindex = 1;
    dev = 0;
    port = 0;
    // if no this filed, means slot equal to 0
    // slot = 0;
    // if no this filed, means uport equal to ifindex
    // uport = 1;
    // pon_dev; just for epon port or invalid port
    // pon_port; just for epon port or invalid port

    // for no_phy, mv88e1340, mv88e1680, amcc22251, ..., if no this filed, means no_phy
    phy_type = "mv88e1680";
    phy_addr = 0x0;

    // for eth or epon
    pt_type = "eth";
    // for 1000_T, 1000_X, 1000_X_INNER, 1000_C, 10G_X, 100_T_ONLY, ...
    intf_style = "1000_T";
    // just for Combo port ,this filed is valid, default is copper
    // def_medium = xx
    // QSGMII     0
    // 1000BASEX  1
    // CASCADE    2
    // SGMII      3
    // XGMII      4
    // SGMII_2_5G 5
    // SRLR       6
    // 100BASEFX  7
    // 10G_KR     8
    // XLG        9
    intfmode_ability = 0x1;  // QSGMII
    intf_mode = "QSGMII";
    
    // poe cap, if no this filed, means don't support
    // poe_cap = {
    //  support = false;
    //  i2c_addr = xx;
    //  pd_chip = xx;
    //  pd_port = xx;
    // }
