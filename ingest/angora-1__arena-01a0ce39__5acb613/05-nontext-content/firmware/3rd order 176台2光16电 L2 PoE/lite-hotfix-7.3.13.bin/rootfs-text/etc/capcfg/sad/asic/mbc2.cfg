  
  // tmp set, if use this cfg file, must be fix some mistack
  
  // for kernel or mbus, if no this field， means kernel
  channel_pex = "mbus";
  
  // for INT_125 or EXT_156_25_DIFF, if no this filed， means INT_125
  serdes_clk = "EXT_156_25_DIFF";
  
  // for 4words or 8words, if no this field，means 4words
  aumsg_len = "8words";
  
  // tti capacity
  tti = 
  {
    // boolean
    share_with_prefix = true;
    // capacity
    capacity = 12288;  // 12 * 1024
    // route capacity, may be * 2
    route_cap = 6064;
    dyn_alloc = false;
  };
  
  // pcl capacity
  pcl_cap = 
  {
    // is_xcat2 boolean
    above_xcat2 = false;
    // capacity
    capacity = 8096;
  };
  
  // policer capacity
  policer = 
  {
    // capacity
    capacity = 1024;
  };
  
  // l2mc capacity
  l2mc_cap = 
  {
    // vidx
    vidx_cap = 4096;
  };
  
  // l3 capacity
  l3_cap =
  {
    // with ltt and route entry
    support_l3 = true;
    // with route prefix
    support_prefix = true;
    prefix_cap = 24576;  // 24 * 1024
    rt_cap = 24576;      // 24 * 1024
    arp_cap = 24576;
  };
  

