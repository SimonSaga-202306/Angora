name = "SWITCH_MAC3L_16GT2XS_2U_P";

version = "0.1";

global = 
{
  @include "/etc/capcfg/sai/series/sw_mac3_lite.cfg"
  
  // product feature's capacity list
  prod_cap = {
    // if no field, means don't support
    poe = true;
  };
  
  
  // poe cap, if no this filed, means don't support
   poe_spec = 
   {
    support = true;
    // for pd69104 or pd69208A
    pd_type = "rtk8238b";
    load_fw = 1;
    chip_num = 6;
    chip_powersupply = 1200;
    sys_powersupply = 2464;
   }
  
  // port num (don't include inner port)
  port_num = 18;
  // inner port num, if no this filed, means none
  // inner_port_num = 0;
  // include subcard, if no this filed, means false
  // include_subcard = false;
};

device = {
  dev = (
    {
      // for lm75, tca1116, pd691xx, pca9548, gpio, cpld, i2c
      type = "gpio";
      // if no this filed, means id = 0
      // id = 0;
      // if no this filed, means name = type-id
      // name = "gpio-0";
      // if no this filed, means default = true;
      // default = true;
    },
    {
      type = "i2c";
    },
    {
      type = "tca1116";
      id = 0;
      default = true;
    }, 
    {
      type = "sel";
    }
  );
  op_map = (
    {
      op = "card_get_fact_reset";
      // if don't care, no this filed
      // phy_ins = 0;
      addr = 13;   // gpio_id
      // if no this filed, means 0
      offset = 0;    // 0 means in, 1 means out
      // if no this filed, means 1
      // width = 1;    for cpld, width fot bits, for i2c, width for bytes
      dev_type = "gpio"; 
      // if no this filed, means default device;
      // dev_id = 0;
      // if no this filed, means read
      // op_type = "read";
    },
    {
      op = "sel_write";
      phy_ins = 0;     // cs-0
      addr = 0x11;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "sel_write";
      phy_ins = 1;     // cs-0
      addr = 0x12;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "tca1116_read";
      phy_ins = 0;     // tca1116-0
      addr = 0x74;
      dev_type = "i2c";
    },
    {
      op = "tca1116_write";
      phy_ins = 0;     // tca1116-0
      addr = 0x74;
      dev_type = "i2c";
    },
    {
      op = "optic_tx_en";
      phy_ins = 17;   //ifindex 9-12, for port 24-27
      phy_ins_num = 1;
      addr = 0x3;    //tca1116 reg
      offset = 1;    // offset 5-4  (port - 20)
      offset_step = -1;
      dev_type = "tca1116";
      dev_id = 0;
      op_type = "write";
    },
    {
      op = "optic_tx_en";
      phy_ins = 18;   //ifindex 9-12, for port 24-27
      phy_ins_num = 1;
      addr = 0x3;    //tca1116 reg
      offset = 3;    // offset 5-4  (port - 20)
      offset_step = -1;
      dev_type = "tca1116";
      dev_id = 0;
      op_type = "write";
    },
    {
      op = "optic_init";
      inherit_op = "optic_tx_en";
      addr_change = 4;            // means addr + 4 for every one
      // offset_change = xx;
    },
    {
      op = "card_set_relay_ctrl";
      addr = 0x6;    //tca1116 reg
      offset = 3;
      dev_type = "tca1116";
      dev_id = 0;
      op_type = "write";
    },
    {
      op = "card_set_relay_data";
      addr = 0x2;    //tca1116 reg
      offset = 3;
      dev_type = "tca1116";
      dev_id = 0;
      op_type = "write";
    },
    {
      op = "led_set_sys_data";
      addr = 32;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "pp_i2c_sel";
      phy_ins = 17;
      addr = 2;
      offset = 0;
      width = 2;
      dev_type = "sel";
      op_type = "write";
    },
    {
      op = "pp_i2c_sel";
      phy_ins = 18;
      addr = 0;
      offset = 0;
      width = 2;
      dev_type = "sel";
      op_type = "write";
    },
    {
      op = "optic_get_ddm";
      //phy_ins = 1;
      addr = 0x51;
      //offset = 1;              //direction for gpio
      dev_type = "i2c";
      op_type = "read";
    },
    {
      op = "optic_get_e2";
      //phy_ins = 1;
      addr = 0x50;
      //offset = 1;              //direction for gpio
      dev_type = "i2c";
      op_type = "read";
    },
    {
      op = "phy_reset_ctrl";
      addr = 0x6;   // tca1116 reg
      offset = 0; 
      dev_type = "tca1116"; 
      op_type = "write";
    },
    {
      op = "phy_reset_data";
      addr = 0x2;    //tca1116 reg
      offset = 0;
      dev_type = "tca1116";
      op_type = "write";
    },
    {
      op = "poe_reset_ctrl";
      addr = 0x6;    //tca1116 reg
      offset = 1;
      dev_type = "tca1116";
      op_type = "write";
    },
    {
      op = "poe_reset_data";
      addr = 0x2;    //tca1116 reg
      offset = 1;
      dev_type = "tca1116";
      op_type = "write";
    },
    {
      op = "poe_power_ctrl";
      addr = 0x6;    //tca1116 reg
      offset = 2;
      dev_type = "tca1116";
      op_type = "write";
    },
    {
      op = "poe_power_data";
      addr = 0x2;    //tca1116 reg
      offset = 2;
      dev_type = "tca1116";
      op_type = "write";
    }
  );
};

port = (
