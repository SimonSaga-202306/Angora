name = "SWITCH_MAC3LC_16GT2GS_2U";

version = "0.1";

global = 
{
  @include "/etc/capcfg/sai/series/sw_mac3_lite_c.cfg"
  
  // poe cap, if no this filed, means don't support
  // poe_spec = 
  // {
  //  support = false;
  //  // for pd69104 or pd69208A
  //  pd_type = "pd69104";
  //  chip_num = 0;
  //  chip_powersupply = 0;
  //  sys_powersupply = 0;
  // }
  
  // port num (don't include inner port)
  port_num = 18;
  // inner port num, if no this filed, means none
  // inner_port_num = 0;
  // include subcard, if no this filed, means false
  // include_subcard = false;
};

device = {
  dev = (
    {
      // for lm75, tca1116, pd691xx, pca9548, gpio, cpld, i2c
      type = "gpio";
      // if no this filed, means id = 0
      // id = 0;
      // if no this filed, means name = type-id
      // name = "gpio-0";
      // if no this filed, means default = true;
      // default = true;
    },
    {
      type = "i2c";
    },
    {
      type = "sel";
    },
    {
      type = "tca1116";
    },
    {
    	type = "pca9548";
    }
  );
  op_map = (
    {
      op = "card_get_fact_reset";
      // if don't care, no this filed
      // phy_ins = 0;
      addr = 13;   // gpio_id
      // if no this filed, means 0
      offset = 0;    // 0 means in, 1 means out
      // if no this filed, means 1
      // width = 1;    for cpld, width fot bits, for i2c, width for bytes
      dev_type = "gpio"; 
      // if no this filed, means default device;
      // dev_id = 0;
      // if no this filed, means read
      // op_type = "read";
    },
    {
      op = "pca9548_read";
      addr = 0x70;
      dev_type = "i2c";
    },
    {
      op = "pca9548_write";
      addr = 0x70;
      dev_type = "i2c";
    },
    {
      op = "optic_get_ddm";
      phy_ins = 17;
      addr = 0x51;
      offset = 6;              //direction for gpio
      dev_type = "pca9548";
      op_type = "read";
    },
    {
      op = "optic_get_e2";
      phy_ins = 17;
      addr = 0x50;
      offset = 6;              //direction for gpio
      dev_type = "pca9548";
      op_type = "read";
    },
    {
      op = "optic_get_ddm";
      phy_ins = 18;
      addr = 0x51;
      offset = 4;              //direction for gpio
      dev_type = "pca9548";
      op_type = "read";
    },
    {
      op = "optic_get_e2";
      phy_ins = 18;
      addr = 0x50;
      offset = 4;              //direction for gpio
      dev_type = "pca9548";
      op_type = "read";
    },
    {
      op = "tca1116_read";
      addr = 0x74;
      dev_type = "i2c";
    },
    {
      op = "tca1116_write";
      addr = 0x74;
      dev_type = "i2c";
    },
    {
      op = "optic_tx_en";
      phy_ins = 18;   //ifindex 1-8, for port 0-7
      phy_ins_num = 1;
      addr = 0x3;    //tca1116 reg
      offset = 4;    // offset 0-7  (= port)
      offset_step = 1;
      dev_type = "tca1116";
      dev_id = 0;
      op_type = "write";
    },
    {
      op = "optic_tx_en";
      phy_ins = 17;   //ifindex 1-8, for port 0-7
      phy_ins_num = 1;
      addr = 0x3;    //tca1116 reg
      offset = 6;    // offset 0-7  (= port)
      offset_step = 1;
      dev_type = "tca1116";
      dev_id = 0;
      op_type = "write";
    },

    {
      op = "optic_init";
      inherit_op = "optic_tx_en";
      addr_change = 4;            // means addr + 4 for every one
    },
    {
      op = "card_set_relay_ctrl";
      addr = 0x6;    //tca1116 reg
      offset = 3;
      dev_type = "tca1116";
      dev_id = 0;
      op_type = "write";
    },
    {
      op = "card_set_relay_data";
      addr = 0x2;    //tca1116 reg
      offset = 3;
      dev_type = "tca1116";
      dev_id = 0;
      op_type = "write";
    },
    {
      op = "led_set_sys_data";
      addr = 32;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "phy_reset_ctrl";
      addr = 0x6;   // tca1116 reg
      offset = 0; 
      dev_type = "tca1116"; 
      op_type = "write";
    },
    {
      op = "phy_reset_data";
      addr = 0x2;    //tca1116 reg
      offset = 0;
      dev_type = "tca1116";
      op_type = "write";
    },
    {
      op = "pca9548_reset_ctrl";
      addr = 0x6;    //tca1116 reg
      offset = 4;
      dev_type = "tca1116";
      op_type = "write";
    },
    {
      op = "pca9548_reset_data";
      addr = 0x2;    //tca1116 reg
      offset = 4;
      dev_type = "tca1116";
      op_type = "write";
    }
  );
};

port = (
  {
    ifindex = 1;
    dev = 0;
    port = 9;
    // if no this filed, means slot equal to 0
    // slot = 0;
    // if no this filed, means uport equal to ifindex
    // uport = 1;
    // pon_dev; just for epon port or invalid port
    // pon_port; just for epon port or invalid port

    // for no_phy, mv88e1340, mv88e1680, amcc22251, ..., if no this filed, means no_phy
    phy_type = "mv88e1680";
    phy_addr = 0x9;

    // for eth or epon
    pt_type = "eth";
    // for 1000_T, 1000_X, 1000_X_INNER, 1000_C, 10G_X, 100_T_ONLY, ...
    intf_style = "100_T_ONLY";
