name = "CTC-48GT6XS"

version = "0.1";

global = 
{
  @include "/etc/capcfg/sai/series/sw_ctm.cfg"
  
  // product feature's capacity list
  prod_cap = {
    // if no field, means don't support
    l3_support = true;
	mirror_cap = 4;
    vrrp_support = true;
    ospf_support = true;
    rip_support = true;
    isis_support = true;
    bgp_support = true;
    ecmp_support = true;
  };
  // port num (don't include inner port)
  port_num = 54;
  mgmt_num = 1;
};

device = {
  dev = (
    {
      type = "tca1116";
    },
    {
      type = "i2c";
    },
    {
      type = "gpio";
    },
    {
      type = "pwm";
    }
  );
  op_map = (
    {
      op = "tca1116_read";
      addr = 0x74;
      dev_type = "i2c";
    },
    {
      op = "tca1116_write";
      addr = 0x74;
      dev_type = "i2c";
    },
    {
      op = "phy_reset_ctrl";
      addr = 0x6;   // tca1116 reg
      offset = 7; 
      dev_type = "tca1116"; 
      op_type = "write";
    },
    {
      op = "phy_reset_data";
      addr = 0x2;    //tca1116 reg
      offset = 7;
      dev_type = "tca1116";
      op_type = "write";
    },
    {
      op = "optic_tx_en";
      phy_ins = 49;   //ifindex 9-12, for port 24-27
      phy_ins_num = 6;
      addr = 0x2;    //tca1116 reg
      offset = 0;    // offset 4-7 (port - 20)
      offset_step = 1;
      dev_type = "tca1116";
      op_type = "write";
    },
    {
      op = "optic_init";
      inherit_op = "optic_tx_en";
      addr_change = 4;            // means addr + 4 for every one
    },
    {
      op = "led_set_sys_ctrl";
      addr = 0;
      offset = 0;
      dev_type = "pwm";
    }
  );  
};

