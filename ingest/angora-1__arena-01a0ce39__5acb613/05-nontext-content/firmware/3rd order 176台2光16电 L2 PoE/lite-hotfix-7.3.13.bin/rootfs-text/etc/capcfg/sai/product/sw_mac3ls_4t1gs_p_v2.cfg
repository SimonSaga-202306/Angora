name = "SWITCH_MAC3L_4T1GS_P_V2";

version = "0.1";

global = 
{
  @include "/etc/capcfg/sai/series/sw_mac3_lite.cfg"
  
  // product feature's capacity list
  prod_cap = {
    // if no field, means don't support
    poe = true;
  };
  
  // poe cap, if no this filed, means don't support
  poe_spec = 
  {
    support = true;
    // for pd69104 or pd69208A
    pd_type = "pd69104";
    chip_num = 1;
    chip_powersupply = 1200;
    sys_powersupply = 606;
  };
  
  // port num (don't include inner port)
  port_num = 5;
  // inner port num, if no this filed, means none
  // inner_port_num = 0;
  // include subcard, if no this filed, means false
  // include_subcard = false;
};

device = {
  dev = (
    {
      // for lm75, tca1116, pd691xx, pca9548, gpio, cpld, i2c
      type = "gpio";
      // if no this filed, means id = 0
      // id = 0;
      // if no this filed, means name = type-id
      // name = "gpio-0";
      // if no this filed, means default = true;
      // default = true;
    },
    {
      type = "i2c";
    },
    {
      type = "sel";
    }
  );
  op_map = (
    {
      op = "card_get_fact_reset";
      // if don't care, no this filed
      // phy_ins = 0;
      addr = 13;   // gpio_id
      // if no this filed, means 0
      offset = 0;    // 0 means in, 1 means out
      // if no this filed, means 1
      // width = 1;    for cpld, width fot bits, for i2c, width for bytes
      dev_type = "gpio"; 
      // if no this filed, means default device;
      // dev_id = 0;
      // if no this filed, means read
      // op_type = "read";
    },
    {
      op = "sel_write";
      phy_ins = 0;     // cs-0
      addr = 0x11;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "sel_write";
      phy_ins = 1;     // cs-0
      addr = 0x12;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "optic_tx_en";
      phy_ins = 5;   //ifindex 9-12, for port 24-27
      phy_ins_num = 1;
      addr = 0x7;    //tca1116 reg
      offset = 1;    // offset 4-7 (port - 20)
      width = 0x55;  //0x55表示GPIO的极性反的，0表示高电平，1表示低电平
      dev_type = "gpio";
    },
    {
      op = "optic_tx_en";
      phy_ins = 6;   //ifindex 9-12, for port 24-27
      phy_ins_num = 1;
      addr = 0x8;    //tca1116 reg
      offset = 1;    // offset 4-7 (port - 20)
      width = 0x55;  //0x55表示GPIO的极性反的，0表示高电平，1表示低电平
      dev_type = "gpio";
    },
    {
      op = "card_set_relay_ctrl";
      addr = 12;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "poe_reset_ctrl";
      addr = 11;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "led_set_sys_data";
      addr = 32;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "pp_i2c_sel";
      phy_ins = 5;
      addr = 3;
      offset = 0;
      width = 2;
      dev_type = "sel";
      op_type = "write";
    },
    {
      op = "pp_i2c_sel";
      phy_ins = 6;
      addr = 2;
      offset = 0;
      width = 2;
      dev_type = "sel";
      op_type = "write";
    },
    {
      op = "optic_get_ddm";
      //phy_ins = 1;
      addr = 0x51;
      //offset = 1;              //direction for gpio
      dev_type = "i2c";
      op_type = "read";
    },
    {
      op = "optic_get_e2";
      //phy_ins = 1;
      addr = 0x50;
      //offset = 1;              //direction for gpio
      dev_type = "i2c";
      op_type = "read";
    }
  );
};

port = (
  {
    ifindex = 1;
    dev = 0;
    port = 0;
    // if no this filed, means slot equal to 0
    // slot = 0;
    // if no this filed, means uport equal to ifindex
    // uport = 1;
    // pon_dev; just for epon port or invalid port
    // pon_port; just for epon port or invalid port

    // for no_phy, mv88e1340, mv88e1680, amcc22251, ..., if no this filed, means no_phy
    phy_type = "mv88e1680";
    phy_addr = 0x0;

    // for eth or epon
    pt_type = "eth";
    // for 1000_T, 1000_X, 1000_X_INNER, 1000_C, 10G_X, 100_T_ONLY, ...
    intf_style = "100_T_ONLY";
    // just for Combo port ,this filed is valid, default is copper
    // def_medium = xx
    // QSGMII     0
    // 1000BASEX  1
    // CASCADE    2
    // SGMII      3
    // XGMII      4
    // SGMII_2_5G 5
    // SRLR       6
    // 100BASEFX  7
    // 10G_KR     8
    // XLG        9
    intfmode_ability = 0x1;  // QSGMII
    intf_mode = "QSGMII";
    
    poe_support = true;
    poe_i2c = 0x21;
    poe_chip = 0;
    poe_port = 0;
    
    // inner flag, if no this filed, means false
    // inner = false;
  },
  {
    ifindex = 2;
    dev = 0;
    port = 1;
    phy_type = "mv88e1680";
    phy_addr = 0x1;
    pt_type = "eth";
    intf_style = "100_T_ONLY";
    intfmode_ability = 0x1;  // QSGMII
    intf_mode = "QSGMII";
    
    poe_support = true;
    poe_i2c = 0x21;
    poe_chip = 0;
    poe_port = 1;
  },
  {
    ifindex = 3;
    dev = 0;
    port = 2;
    phy_type = "mv88e1680";
    phy_addr = 0x2;
    pt_type = "eth";
    intf_style = "100_T_ONLY";
    intfmode_ability = 0x1;  // QSGMII
    intf_mode = "QSGMII";
    
    poe_support = true;
    poe_i2c = 0x21;
    poe_chip = 0;
    poe_port = 2;
  },
  {
    ifindex = 4;
    dev = 0;
    port = 3;
    phy_type = "mv88e1680";
    phy_addr = 0x3;
    pt_type = "eth";
    intf_style = "100_T_ONLY";
    intfmode_ability = 0x1;  // QSGMII
    intf_mode = "QSGMII";
    
    poe_support = true;
    poe_i2c = 0x21;
    poe_chip = 0;
    poe_port = 3;
  },
  {
    ifindex = 5;
    dev = 0;
    port = 24;
    pt_type = "eth";
    intf_style = "1000_X";
    intfmode_ability = 0xA;  // 1000BASEX | SGMII | SGMII_2_5G
    intf_mode = "1000BASEX";
  }
);