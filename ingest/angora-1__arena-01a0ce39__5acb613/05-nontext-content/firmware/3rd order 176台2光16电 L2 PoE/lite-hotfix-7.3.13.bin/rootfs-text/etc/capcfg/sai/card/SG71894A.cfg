    // 1000BASEX  1
    // CASCADE    2
    // SGMII      3
    // XGMII      4
    // SGMII_2_5G 5
    // SRLR       6
    // 100BASEFX  7
    // 10G_KR     8
    // XLG        9
    intfmode_ability = 0x80;  // QSGMII
    intf_mode = "100BASEFX";
    
    // poe cap, if no this filed, means don't support
