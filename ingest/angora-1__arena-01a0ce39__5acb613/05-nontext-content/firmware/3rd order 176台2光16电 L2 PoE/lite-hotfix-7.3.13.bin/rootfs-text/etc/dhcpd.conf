# dhcpd.conf

option domain-name "opennetwork";
option domain-name-servers 114.114.114.114;
server-name "Switch";

default-lease-time 600;
max-lease-time 7200;

# log-facility local7;
option vendor43 code 43 = string;

class "local_pc" {
  match if substring (option vendor-class-identifier, 0, 4) = "MSFT";
}

subnet 192.168.1.0 netmask 255.255.255.0 {
}
subnet 192.168.100.0 netmask 255.255.255.0 {
}
subnet 10.10.10.0 netmask 255.255.255.0 {
}
subnet 2.2.2.0 netmask 255.255.255.0 {
  option routers 2.2.2.1;
  default-lease-time 600;
  max-lease-time 7200;
  pool {
    allow members of "local_pc";
    range 2.2.2.100 2.2.2.254;
    send vendor43 "2.2.2.100";
  }
  pool {
    deny members of "local_pc";
    range 2.2.2.2 2.2.2.99;
    send vendor43 "10.10.10.100";
  }
}

