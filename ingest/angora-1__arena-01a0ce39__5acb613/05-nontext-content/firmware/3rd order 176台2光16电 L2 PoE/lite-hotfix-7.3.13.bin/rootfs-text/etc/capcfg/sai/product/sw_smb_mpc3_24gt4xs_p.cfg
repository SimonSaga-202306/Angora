name = "SWITCH_SMB_MAC3LC_24GT4GS_P";

version = "0.1";

global = 
{
  @include "/etc/capcfg/sai/series/sw_mpc3_smi.cfg"

  fan_spec = {
    support = true;
    subfan_num = 0;
    high_support = true;
    high_trig_level = 900;
    high_clear_level = 850;
  };  

  // product feature's capacity list
  prod_cap = {
    // if no field, means don't support
    poe = true;
  };
  
  // poe cap, if no this filed, means don't support
  poe_spec = 
  {
    support = true;
    // for pd69104 or pd69208A
    pd_type = "rtk8238";
    chip_num = 3;
    chip_powersupply = 2400;
    sys_powersupply = 3696;
  };  
  
  // port num (don't include inner port)
  port_num = 28;
  // inner port num, if no this filed, means none
  // inner_port_num = 0;
  // include subcard, if no this filed, means false
  // include_subcard = false;
};

device = {
  dev = (
    {
      // for lm75, tca1116, pd691xx, pca9548, gpio, cpld, i2c
      type = "gpio";
      // if no this filed, means id = 0
      // id = 0;
      // if no this filed, means name = type-id
      // name = "gpio-0";
      // if no this filed, means default = true;
      // default = true;
    },
    {
      type = "i2c";
    },
    {
      type = "sel";
    },
    {
      type = "pwm";
    }
  );
  op_map = (
    {
      op = "card_get_fact_reset";
      // if don't care, no this filed
      // phy_ins = 0;
      addr = 13;   // gpio_id
      // if no this filed, means 0
      offset = 0;    // 0 means in, 1 means out
      // if no this filed, means 1
      // width = 1;    for cpld, width fot bits, for i2c, width for bytes
      dev_type = "gpio"; 
      // if no this filed, means default device;
      // dev_id = 0;
      // if no this filed, means read
      // op_type = "read";
    },
    {
      op = "sel_write";
      phy_ins = 0;     // cs-0
      addr = 0x11;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "sel_write";
      phy_ins = 1;     // cs-0
      addr = 0x12;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "optic_tx_en";
      phy_ins = 25;   //ifindex 9-12, for port 24-27
      phy_ins_num = 1;
      addr = 0x7;    //tca1116 reg
      offset = 1;    // offset 4-7 (port - 20)
      width = 0x55;  //0x55表示GPIO的极性反的，0表示高电平，1表示低电平
      dev_type = "gpio";
    },
    {
      op = "optic_tx_en";
      phy_ins = 26;   //ifindex 9-12, for port 24-27
      phy_ins_num = 1;
      addr = 0x9;    //tca1116 reg
      offset = 1;    // offset 4-7 (port - 20)
      width = 0x55;  //0x55表示GPIO的极性反的，0表示高电平，1表示低电平
      dev_type = "gpio";
    },
    {
      op = "optic_tx_en";
      phy_ins = 27;   //ifindex 9-12, for port 24-27
      phy_ins_num = 1;
      addr = 0x8;    //tca1116 reg
      offset = 1;    // offset 4-7 (port - 20)
      width = 0x55;  //0x55表示GPIO的极性反的，0表示高电平，1表示低电平
      dev_type = "gpio";
    },
    {
      op = "optic_tx_en";
      phy_ins = 28;   //ifindex 9-12, for port 24-27
      phy_ins_num = 1;
      addr = 0xa;    //tca1116 reg
      offset = 1;    // offset 4-7 (port - 20)
      width = 0x55;  //0x55表示GPIO的极性反的，0表示高电平，1表示低电平
      dev_type = "gpio";
    },
    {
      op = "led_set_sys_data";
      addr = 32;
      offset = 1;
      dev_type = "gpio";
    },
    {
      op = "pp_i2c_sel";
      phy_ins = 25;
      addr = 3;
      offset = 0;
      width = 2;
      dev_type = "sel";
      op_type = "write";
    },
    {
      op = "pp_i2c_sel";
      phy_ins = 26;
      addr = 1;
      offset = 0;
      width = 2;
      dev_type = "sel";
      op_type = "write";
    },
    {
      op = "pp_i2c_sel";
      phy_ins = 27;
      addr = 2;
      offset = 0;
      width = 2;
      dev_type = "sel";
      op_type = "write";
    },
    {
      op = "pp_i2c_sel";
      phy_ins = 28;
      addr = 0;
      offset = 0;
      width = 2;
      dev_type = "sel";
      op_type = "write";
    },
    {
      op = "optic_get_ddm";
      //phy_ins = 1;
      addr = 0x51;
      //offset = 1;              //direction for gpio
      dev_type = "i2c";
      op_type = "read";
    },
    {
      op = "optic_get_e2";
      //phy_ins = 1;
      addr = 0x50;
      //offset = 1;              //direction for gpio
      dev_type = "i2c";
      op_type = "read";
    },    
    {
      op = "fan_set_speed";
      addr = 0;
      offset = 0;
      dev_type = "pwm";
    },
    {
      op = "poe_reset_ctrl";
      addr = 11;
      offset = 1;
      dev_type = "gpio";
    }
  );
};

